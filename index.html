<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuro da IA</title>
    <style>
        :root {
            --cor-fundo: #01080E;
            --cor-principal: #0B0D20;
            --cor-secundaria: #212333;
            --cor-destaque: #2BDEFD;
            --cor-texto: #D7F9FF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
        }

        .caixa-principal {
            background-color: var(--cor-principal);
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 30px 25px;
            border-radius: 24px;
            border: 1px solid rgba(43, 222, 253, 0.15);
            box-shadow: 0 8px 32px rgba(43, 222, 253, 0.08);
        }

        h1 {
            color: var(--cor-destaque);
            font-size: 2.2rem;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        .caixa-perguntas {
            font-size: 1.3rem;
            line-height: 1.5;
            min-height: 80px;
            padding: 15px 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(43, 222, 253, 0.15);
            color: #e8faff;
        }

        .caixa-alternativas {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0 15px;
        }

        button {
            background-color: var(--cor-secundaria);
            color: var(--cor-texto);
            border: none;
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: left;
            line-height: 1.4;
            border: 1px solid transparent;
        }

        button:hover {
            background-color: var(--cor-destaque);
            color: var(--cor-principal);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(43, 222, 253, 0.2);
            border-color: var(--cor-destaque);
        }

        .caixa-resultado {
            margin-top: 25px;
            padding: 20px 18px;
            background: rgba(11, 13, 32, 0.6);
            border-radius: 20px;
            border-left: 4px solid var(--cor-destaque);
        }

        .texto-resultado {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e2faff;
            text-align: left;
        }

        /* Estado final */
        .final .caixa-alternativas {
            display: none;
        }

        .final .caixa-perguntas {
            border-bottom-color: var(--cor-destaque);
            color: var(--cor-destaque);
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.8rem; }
            .caixa-perguntas { font-size: 1.1rem; }
            button { font-size: 0.95rem; padding: 14px 16px; }
            .caixa-principal { padding: 20px 15px; }
        }
    </style>
</head>
<body>
    <div class="caixa-principal" id="caixaPrincipal">
        <h1>🤖 Futuro da IA</h1>
        <div class="caixa-perguntas" id="caixaPerguntas"></div>
        <div class="caixa-alternativas" id="caixaAlternativas"></div>
        <div class="caixa-resultado">
            <p class="texto-resultado" id="textoResultado"></p>
        </div>
    </div>

    <script>
        // ===== DOM =====
        const caixaPrincipal = document.getElementById('caixaPrincipal');
        const caixaPerguntas = document.getElementById('caixaPerguntas');
        const caixaAlternativas = document.getElementById('caixaAlternativas');
        const textoResultado = document.getElementById('textoResultado');

        // ===== PERGUNTAS SOBRE FUTURO DA IA =====
        const perguntas = [
            {
                enunciado: "A Inteligência Artificial generativa (como ChatGPT e DALL-E) está revolucionando a criatividade. Como você acredita que devemos usá-la?",
                alternativas: [
                    {
                        texto: "Como ferramenta de apoio — ela amplia nossa criatividade, mas o toque humano é insubstituível.",
                        afirmacao: "A IA generativa é uma aliada poderosa. Ela potencializa nossa capacidade de criar, mas a essência, a emoção e a intenção humana continuam sendo o coração de toda obra. O futuro é colaborativo."
                    },
                    {
                        texto: "Como substituta — em muitos casos, a IA já gera conteúdo tão bom ou melhor que o humano, com muito mais eficiência.",
                        afirmacao: "A eficiência da IA é inegável, mas substituir completamente o humano na criação pode levar à perda de diversidade e autenticidade. O equilíbrio entre máquina e humano será o grande desafio."
                    }
                ]
            },
            {
                enunciado: "Com o avanço da IA, muitos empregos serão automatizados. Qual caminho você considera mais promissor para a sociedade?",
                alternativas: [
                    {
                        texto: "Investir em requalificação e educação contínua, focando em habilidades emocionais e criativas.",
                        afirmacao: "Investir em educação e requalificação é a chave para um futuro onde humanos e IA coexistem. As habilidades socioemocionais e a capacidade de inovar serão os diferenciais."
                    },
                    {
                        texto: "Aceitar a automação e implementar uma renda básica universal, enquanto a IA cuida das tarefas repetitivas.",
                        afirmacao: "A renda básica universal pode ser uma solução para a disrupção causada pela IA, mas é fundamental repensar o sentido do trabalho e da realização pessoal na sociedade."
                    }
                ]
            },
            {
                enunciado: "A IA pode tomar decisões éticas? Quem deve ser responsável por seus erros?",
                alternativas: [
                    {
                        texto: "A IA não tem consciência, portanto a responsabilidade é sempre humana — desenvolvedores, empresas e governos.",
                        afirmacao: "A ética é uma construção humana. Por mais avançada que seja a IA, a responsabilidade final deve recair sobre quem a projeta e a utiliza. Transparência e auditoria são essenciais."
                    },
                    {
                        texto: "A IA pode ser programada com princípios éticos e, com o tempo, aprender a tomar decisões melhores que os humanos.",
                        afirmacao: "Programar ética em IA é um desafio imenso, mas não impossível. No entanto, a complexidade moral humana dificilmente será totalmente capturada por algoritmos."
                    }
                ]
            },
            {
                enunciado: "Qual o maior risco que a IA representa para a humanidade nas próximas décadas?",
                alternativas: [
                    {
                        texto: "A perda de privacidade e o controle massivo de dados por poucas corporações.",
                        afirmacao: "A concentração de dados e o viés algorítmico são ameaças reais. Precisamos de regulamentação e conscientização para garantir que a IA sirva à democracia e não ao autoritarismo."
                    },
                    {
                        texto: "O desenvolvimento de armas autônomas e o uso bélico da IA.",
                        afirmacao: "A corrida armamentista com IA é um dos maiores perigos. É urgente um tratado global que limite o uso de sistemas autônomos em conflitos, antes que seja tarde."
                    }
                ]
            },
            {
                enunciado: "Como você imagina a interação humano-IA daqui a 20 anos?",
                alternativas: [
                    {
                        texto: "Será tão natural quanto usar a internet hoje — assistentes virtuais onipresentes e personalizados.",
                        afirmacao: "A IA estará integrada ao nosso dia a dia, antecipando necessidades e facilitando tarefas. A fronteira entre o digital e o físico será cada vez mais tênue."
                    },
                    {
                        texto: "Haverá uma resistência significativa, com movimentos contra a dependência tecnológica.",
                        afirmacao: "A resistência é parte natural da evolução. Veremos um equilíbrio entre adoção e cautela, com comunidades buscando viver de forma mais desconectada da IA."
                    }
                ]
            }
        ];

        // ===== ESTADO =====
        let atual = 0;
        let historiaFinal = "";

        // ===== FUNÇÕES =====
        function mostrarPergunta() {
            if (atual >= perguntas.length) {
                mostrarResultado();
                return;
            }

            const perguntaAtual = perguntas[atual];
            caixaPerguntas.textContent = perguntaAtual.enunciado;
            caixaAlternativas.innerHTML = "";

            perguntaAtual.alternativas.forEach((alternativa) => {
                const botao = document.createElement('button');
                botao.textContent = alternativa.texto;
                botao.addEventListener('click', () => {
                    historiaFinal += alternativa.afirmacao + " ";
                    atual++;
                    mostrarPergunta();
                });
                caixaAlternativas.appendChild(botao);
            });

            caixaPrincipal.classList.remove('final');
            textoResultado.textContent = "";
        }

        function mostrarResultado() {
            caixaPrincipal.classList.add('final');
            caixaPerguntas.textContent = "🧠 Reflexão sobre o Futuro da IA";
            textoResultado.textContent = historiaFinal.trim() || "Nenhuma resposta registrada. Reflita sobre o impacto da IA em nossas vidas.";
            caixaAlternativas.innerHTML = "";
        }

        // ===== INICIAR =====
        mostrarPergunta();

        // ===== REINICIAR (duplo clique no título) =====
        document.querySelector('h1').addEventListener('dblclick', function() {
            atual = 0;
            historiaFinal = "";
            caixaPrincipal.classList.remove('final');
            textoResultado.textContent = "";
            mostrarPergunta();
            this.style.transform = 'scale(0.95)';
            setTimeout(() => this.style.transform = 'scale(1)', 150);
        });
    </script>
</body>
</html>
